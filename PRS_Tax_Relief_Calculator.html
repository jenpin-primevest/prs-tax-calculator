<!doctype html>
<html lang="en-MY">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#243270" />
<title>PRS Tax Savings Calculator | PPA PRS Calculator</title>
<meta name="description" content="See how much income tax you can save by investing RM3,000 a year in a Private Retirement Scheme (PRS). Free, no sign-up." />
<link rel="icon" type="image/png" href="https://prscalculator.ppa.my/ppa_prs-new.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- Tokens (match prscalculator.ppa.my) ---------- */
  :root {
    --brand: #243270;
    --brand-2: #4b5aa0;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --tint: #f8fafc;
    --ring: rgba(36, 50, 112, .35);
    --brand-soft: rgba(36, 50, 112, .08);
    --save: #0f9f6e;
    --save-soft: rgba(15, 159, 110, .1);
    --pay: #b45309;
    --radius-card: 20px;
    --font-display: "Sora", "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); line-height: 1.5;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: clip;
  }
  a { color: inherit; }
  button { font: inherit; }
  [hidden] { display: none !important; }
  :where(a, button, input, summary, label):focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  .app-container { margin: 0 auto; max-width: 80rem; padding: 0 1rem; }
  @media (min-width: 640px) { .app-container { padding: 0 1.5rem; } }
  @media (min-width: 1024px) { .app-container { padding: 0 2rem; } }

  /* ---------- Buttons ---------- */
  .btn-primary, .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: 12px;
    padding: .75rem 2rem; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: filter .2s, transform .2s, box-shadow .2s, background .2s;
  }
  .btn-primary { color: #fff; border: 1px solid rgba(255,255,255,.35); background-image: linear-gradient(90deg, var(--brand), var(--brand-2)); box-shadow: 0 10px 26px rgba(36,50,112,.18); }
  .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .btn-secondary { color: var(--ink); border: 1px solid rgba(148,163,184,.4); background: rgba(255,255,255,.65); }
  .btn-secondary:hover { background: rgba(255,255,255,.85); transform: translateY(-1px); }
  .btn-sm { padding: .6rem 1rem; font-size: .875rem; }

  /* ---------- Header ---------- */
  .prs-header { position: fixed; inset: 0 0 auto 0; z-index: 50; border-bottom: 1px solid transparent; transition: background .3s, border-color .3s, box-shadow .3s; }
  .prs-header.is-compact { background: rgba(248,250,252,.72); border-bottom-color: rgba(226,232,240,.55); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); box-shadow: 0 4px 16px rgba(15,23,42,.06); }
  .prs-header.menu-open { background: rgba(248,250,252,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .65rem 0; transition: padding .3s; }
  .is-compact .header-row { padding: .4rem 0; }
  .logo img { display: block; height: 2.5rem; width: auto; transition: height .3s; }
  .is-compact .logo img { height: 2rem; }
  @media (min-width: 768px) { .logo img { height: 3rem; } .is-compact .logo img { height: 2.25rem; } }
  .nav, .header-actions { display: none; align-items: center; gap: .4rem; }
  .nav-pill { white-space: nowrap; border-radius: 1rem; padding: .625rem 1rem; font-size: .875rem; font-weight: 600; color: var(--muted); text-decoration: none; transition: color .15s, background .15s; }
  .nav-pill:hover { color: var(--ink); background: rgba(255,255,255,.8); }
  .nav-pill.is-active { background: var(--brand); color: #fff; }
  .lang-toggle { display: inline-flex; border-radius: 12px; border: 1px solid rgba(226,232,240,.7); background: rgba(255,255,255,.7); padding: 4px; }
  .lang-toggle button { border: 0; background: transparent; border-radius: 8px; padding: .375rem .625rem; font-size: .875rem; font-weight: 600; color: var(--muted); cursor: pointer; }
  .lang-toggle button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .menu-btn { display: inline-flex; border: 0; background: transparent; padding: .5rem; border-radius: 12px; color: var(--muted); cursor: pointer; }
  .mobile-menu { display: none; padding: .5rem 0 1rem; gap: .375rem; }
  .mobile-menu.is-open { display: grid; }
  .mobile-menu .row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .5rem; }
  .mobile-menu .lang-toggle { grid-column: 1 / -1; justify-self: start; }
  @media (min-width: 1024px) {
    .nav, .header-actions { display: flex; }
    .menu-btn, .mobile-menu.is-open { display: none; }
  }

  /* ---------- Background + hero ---------- */
  .page-bg { position: relative; isolation: isolate; }
  .aurora {
    position: absolute; inset: -10% -10% auto -10%; height: 900px; pointer-events: none; z-index: -1; opacity: .85; filter: blur(30px) saturate(120%);
    background: radial-gradient(60% 45% at 20% 15%, rgba(36,50,112,.18), transparent 70%), radial-gradient(55% 40% at 85% 25%, rgba(155,161,190,.25), transparent 70%), radial-gradient(45% 35% at 50% 90%, rgba(75,90,160,.12), transparent 75%);
  }
  .grid-pattern {
    position: absolute; inset: 0 0 auto 0; height: 700px; pointer-events: none; z-index: -1; opacity: .45;
    background-image: linear-gradient(rgba(36,50,112,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(36,50,112,.05) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 85%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 85%);
  }
  main.app-container { padding-top: 4.5rem; }
  .hero { text-align: center; padding: 2rem 0 1.75rem; }
  .hero h1 { margin: 0 auto; max-width: 22ch; font-family: var(--font-display); font-weight: 600; color: var(--brand); font-size: clamp(1.6rem, 3.6vw + .7rem, 3.1rem); line-height: 1.1; letter-spacing: -.035em; text-wrap: balance; }
  .hero p { margin: .9rem auto 0; max-width: 40rem; color: var(--muted); font-size: 1rem; line-height: 1.65; text-wrap: balance; }
  @media (min-width: 768px) { main.app-container { padding-top: 5.5rem; } .hero { padding: 2.75rem 0 2.25rem; } .hero p { font-size: 1.125rem; } }

  /* ---------- Layout + cards ---------- */
  .calc-grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .calc-grid { grid-template-columns: minmax(0, 7fr) minmax(0, 4.5fr); gap: 1.5rem; align-items: start; } }
  .card { background: rgba(255,255,255,.92); border: 1px solid rgba(226,232,240,.9); border-radius: var(--radius-card); box-shadow: 0 8px 30px rgba(15,23,42,.06); padding: 1.25rem; min-width: 0; }
  @media (min-width: 640px) { .card { padding: 1.75rem; } }
  @media (max-width: 480px) { .card { padding: 1rem; } }
  .card-title { display: flex; align-items: center; gap: .65rem; margin: 0 0 1.25rem; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--brand); letter-spacing: -.02em; }
  .icon-tile { display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: .75rem; flex-shrink: 0; background: linear-gradient(135deg, rgba(36,50,112,.12), rgba(155,161,190,.15)); color: var(--brand); }
  .block { padding-top: 3rem; }

  /* ---------- Income input ---------- */
  .label { display: block; font-size: .9375rem; font-weight: 600; margin-bottom: .6rem; }
  .hint { margin: .5rem 0 0; font-size: .8125rem; color: var(--muted); }
  .money-input { position: relative; }
  .money-input span { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
  .input-glass { width: 100%; background: rgba(255,255,255,.85); border: 1px solid rgba(148,163,184,.55); border-radius: 12px; box-shadow: inset 0 1px 2px rgba(0,0,0,.04); padding: .75rem 1rem .75rem 3rem; font-size: 1.125rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .input-glass:focus { outline: 3px solid var(--ring); outline-offset: 2px; border-color: var(--brand); }
  .money-input.sm span { font-size: .875rem; left: .85rem; }
  .money-input.sm .input-glass { font-size: .9375rem; padding: .6rem .85rem .6rem 2.6rem; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; margin: 1rem 0 .25rem; cursor: pointer; background: linear-gradient(90deg, var(--brand) 0 var(--pct, 0%), #e5e7eb var(--pct, 0%) 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(36,50,112,.35); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--brand); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(36,50,112,.35); }
  .range-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
  .chip { border: 1px solid rgba(36,50,112,.15); background: #fff; color: var(--brand); border-radius: 999px; padding: .35rem .8rem; font-size: .8125rem; font-weight: 600; cursor: pointer; }
  .chip:hover { background: var(--brand-soft); }
  .chip.is-active { background: var(--brand); color: #fff; border-color: var(--brand); }

  /* ---------- Tax reliefs panel ---------- */
  .reliefs { margin-top: 1.5rem; }
  .rl-head { display: flex; align-items: center; gap: .9rem; padding: 1rem 1.1rem; border-radius: 16px; cursor: pointer; border: 1px solid rgba(36,50,112,.14); background: linear-gradient(135deg, rgba(36,50,112,.06), rgba(155,161,190,.12)); transition: border-color .2s; }
  .rl-head:hover { border-color: rgba(36,50,112,.3); }
  .rl-head .icon-tile { background: #fff; box-shadow: 0 2px 8px rgba(36,50,112,.12); }
  .rl-text { flex: 1; min-width: 0; }
  .rl-title { display: block; font-family: var(--font-display); font-weight: 700; color: var(--brand); line-height: 1.3; }
  .rl-sub { display: block; margin-top: .2rem; font-size: .8125rem; color: var(--muted); line-height: 1.45; }
  .switch { position: relative; flex-shrink: 0; width: 44px; height: 26px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #cbd5e1; transition: background .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.25); transition: transform .2s; }
  .switch input:checked + span { background: var(--brand); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 3px solid var(--ring); outline-offset: 2px; }
  .rl-body { margin-top: .9rem; display: grid; gap: .75rem; }
  @media (max-width: 480px) { .rl-head { padding: .85rem .9rem; } .rl-head .icon-tile { display: none; } .flow { padding: .75rem; } }

  /* income − reliefs = chargeable income */
  .flow { border-radius: 16px; background: #fff; border: 1px solid var(--line); padding: 1rem; }
  .flow-grid { display: grid; grid-template-columns: minmax(0,1fr) 24px minmax(0,1fr) 24px minmax(0,1.15fr); gap: .5rem; }
  .flow-item { border-radius: 12px; padding: .7rem .8rem; background: var(--tint); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .flow-item span { font-size: .7rem; font-weight: 600; color: var(--muted); line-height: 1.3; }
  .flow-item b { margin-top: .25rem; font-family: var(--font-display); font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .flow-item.minus b { color: var(--save); }
  .flow-item.result { background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
  .flow-item.result span { color: rgba(255,255,255,.78); }
  .flow-item.result b { color: #fff; font-size: 1.15rem; }
  .flow-op { align-self: center; width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .flow-bar { margin-top: .85rem; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: #e5e7eb; }
  .flow-bar i { transition: width .4s; }
  .fb-ci { background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
  .fb-rel { background: var(--save); }
  .flow-note { margin: .55rem 0 0; font-size: .72rem; color: var(--muted); }
  @media (max-width: 560px) {
    .flow-grid { grid-template-columns: minmax(0,1fr); gap: .35rem; }
    .flow-op { justify-self: center; }
    .flow-item { flex-direction: row; justify-content: space-between; align-items: center; gap: .75rem; }
    .flow-item b { margin-top: 0; }
  }

  /* category cards */
  .cat { border: 1px solid var(--line); border-radius: 16px; background: #fff; }
  .cat[open] { border-color: rgba(36,50,112,.22); box-shadow: 0 6px 22px rgba(15,23,42,.05); }
  .cat > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: .75rem; padding: .75rem .9rem; border-radius: 16px; }
  .cat > summary::-webkit-details-marker { display: none; }
  .cat-icon { width: 2.25rem; height: 2.25rem; border-radius: .7rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(36,50,112,.12), rgba(155,161,190,.15)); color: var(--brand); }
  .cat-title { display: block; font-size: .9rem; font-weight: 700; line-height: 1.3; }
  .cat-meta { display: block; margin-top: .1rem; font-size: .72rem; color: var(--muted); }
  .cat-total { justify-self: end; font-size: .8125rem; font-weight: 700; color: var(--save); background: var(--save-soft); padding: .25rem .65rem; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cat-total.is-zero { color: var(--muted); background: #f1f5f9; font-weight: 600; }
  .cat-chev { width: 28px; height: 28px; border-radius: 50%; background: #f1f5f9; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: transform .2s; }
  .cat[open] .cat-chev { transform: rotate(180deg); background: var(--brand-soft); color: var(--brand); }
  .cat-body { margin: 0 .9rem; padding: 1rem 0 1.1rem; border-top: 1px dashed var(--line); display: grid; gap: 1.1rem; container-type: inline-size; }
  @media (max-width: 520px) {
    .cat > summary { grid-template-columns: auto auto minmax(0,1fr) auto; column-gap: .65rem; row-gap: .15rem; padding: .7rem .75rem; }
    .cat-text { display: contents; }
    .cat-icon { grid-row: 1 / span 2; }
    .cat-title { grid-column: 2 / 4; grid-row: 1; }
    .cat-meta { grid-column: 2; grid-row: 2; margin: 0; }
    .cat-total { grid-column: 3; grid-row: 2; justify-self: start; font-size: .72rem; padding: .05rem .5rem; }
    .cat-chev { grid-column: 4; grid-row: 1 / span 2; }
    .cat-body { margin: 0 .75rem; }
  }

  /* fields: label / input / note line up across columns */
  .fields, .toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); column-gap: 1.25rem; }
  .fields { row-gap: 1.1rem; }
  .toggles { row-gap: .6rem; }
  .field { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: .4rem; min-width: 0; }
  @supports not (grid-template-rows: subgrid) { .field { display: flex; flex-direction: column; gap: .4rem; } }
  @container (max-width: 480px) { .field { display: flex; flex-direction: column; gap: .4rem; } }
  .f-head { display: flex; justify-content: space-between; align-items: flex-end; gap: .6rem; }
  .f-label { font-size: .8125rem; font-weight: 600; line-height: 1.35; }
  .f-cap { flex-shrink: 0; font-size: .68rem; font-weight: 600; color: var(--muted); background: #f1f5f9; border-radius: 999px; padding: .15rem .5rem; white-space: nowrap; }
  .f-foot { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; font-size: .72rem; color: var(--muted); line-height: 1.45; }
  .f-foot:empty { display: none; }
  .f-auto { display: inline-flex; align-items: center; gap: .3rem; border: 1px solid rgba(36,50,112,.18); background: #fff; color: var(--brand); border-radius: 999px; padding: .2rem .6rem; font-size: .72rem; font-weight: 600; cursor: pointer; }
  .f-auto:hover { background: var(--brand-soft); }
  .input-locked { display: flex; align-items: center; justify-content: space-between; padding: .6rem .85rem; border-radius: 12px; background: #f1f5f9; border: 1px dashed rgba(148,163,184,.7); font-weight: 700; color: var(--brand); font-size: .9375rem; }
  .input-locked svg { color: var(--muted); }

  /* tick tiles for fixed-amount reliefs */
  .toggle-tile { position: relative; display: flex; align-items: center; gap: .7rem; padding: .7rem .85rem; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; }
  .toggle-tile:hover { border-color: rgba(36,50,112,.3); }
  .toggle-tile input { position: absolute; opacity: 0; pointer-events: none; }
  .tt-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #cbd5e1; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .tt-check svg { opacity: 0; }
  .toggle-tile:has(input:checked) { border-color: var(--brand); background: rgba(36,50,112,.04); }
  .toggle-tile input:checked ~ .tt-check { background: var(--brand); border-color: var(--brand); }
  .toggle-tile input:checked ~ .tt-check svg { opacity: 1; }
  .toggle-tile input:focus-visible ~ .tt-check { outline: 3px solid var(--ring); outline-offset: 2px; }
  .tt-text { flex: 1; min-width: 0; font-size: .8125rem; font-weight: 600; line-height: 1.35; }
  .tt-amt { font-size: .75rem; font-weight: 700; color: var(--brand); white-space: nowrap; }

  /* children + housing */
  .wide { display: grid; gap: .45rem; }
  .kids-list { margin-top: .2rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .kid-row { display: grid; grid-template-columns: minmax(0,1fr) 7.25rem 7.25rem; align-items: center; gap: .75rem; padding: .6rem .75rem; }
  .kid-row + .kid-row { border-top: 1px solid var(--line); }
  .kid-head { background: var(--tint); padding-block: .45rem; }
  .kid-head span { font-size: .68rem; font-weight: 700; color: var(--muted); text-align: center; }
  .kid-label { font-size: .8125rem; line-height: 1.35; }
  .kid-label small { display: block; margin-top: .1rem; font-size: .7rem; color: var(--muted); }
  .kid-cap { display: none; font-size: .68rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
  .stepper { display: grid; grid-template-columns: 32px minmax(0,1fr) 32px; align-items: center; height: 34px; border: 1px solid rgba(148,163,184,.55); border-radius: 10px; overflow: hidden; background: #fff; }
  .stepper.has-val { border-color: var(--brand); }
  .stepper button { height: 100%; border: 0; background: transparent; color: var(--brand); font-size: 1.05rem; font-weight: 700; cursor: pointer; }
  .stepper button:hover:not(:disabled) { background: var(--brand-soft); }
  .stepper button:disabled { color: #cbd5e1; cursor: default; }
  .stepper output { text-align: center; font-weight: 700; font-size: .875rem; font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) {
    .kid-row { grid-template-columns: minmax(0,1fr) minmax(0,1fr); row-gap: .5rem; }
    .kid-label { grid-column: 1 / -1; }
    .kid-head { display: none; }
    .kid-row:nth-child(2) { border-top: 0; }
    .kid-cap { display: block; }
  }
  .seg2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .6rem; }
  .seg2 label { position: relative; display: flex; flex-direction: column; gap: .15rem; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; }
  .seg2 input { position: absolute; opacity: 0; pointer-events: none; }
  .seg2 b { font-size: .78rem; font-weight: 600; line-height: 1.35; }
  .seg2 small { font-size: .7rem; font-weight: 600; color: var(--muted); }
  .seg2 label:has(input:checked) { border-color: var(--brand); background: rgba(36,50,112,.04); box-shadow: inset 0 0 0 1px var(--brand); }
  .seg2 label:has(input:focus-visible) { outline: 3px solid var(--ring); outline-offset: 2px; }
  @media (max-width: 420px) { .seg2 { grid-template-columns: minmax(0,1fr); } }
  .sub-label { font-size: .75rem; font-weight: 600; color: var(--muted); margin-top: .15rem; }
  .rl-foot { display: flex; justify-content: flex-end; }
  .rl-reset { display: inline-flex; align-items: center; gap: .35rem; border: 0; background: none; padding: .25rem 0; font-size: .78rem; font-weight: 600; color: var(--muted); cursor: pointer; }
  .rl-reset:hover { color: var(--ink); }

  /* ---------- Result card ---------- */
  .result-card { border-top: 3px solid var(--brand); }

const PRS_RELIEF = 3000;
const BANDS = [ // [from, to, rate] — each band covers (from, to]
  [0, 5000, 0], [5000, 20000, .01], [20000, 35000, .03], [35000, 50000, .06], [50000, 70000, .11],
  [70000, 100000, .19], [100000, 400000, .25], [400000, 600000, .26], [600000, 2000000, .28], [2000000, Infinity, .30]
];
const REBATE = { limit: 35000, self: 400, spouse: 400 };

const bandIndex = (ci) => BANDS.findIndex(([, to]) => ci <= to);
const taxTiers = (ci) => BANDS
  .map(([from, to, rate], i) => ({ i, rate, portion: Math.max(0, Math.min(ci, to) - from) }))
  .filter((x) => x.portion > 0)
  .map((x) => ({ ...x, tax: x.portion * x.rate }));

/* Workbook rows C1–D4: income tax, rebates, tax charged (zakat, credits and PCB excluded). */
function taxCharged(ci, spouseRelief) {
  const incomeTax = taxTiers(ci).reduce((sum, x) => sum + x.tax, 0);                 // C3
  const self = ci > 0 && ci <= REBATE.limit ? REBATE.self : 0;                       // D1
  const spouse = spouseRelief && self ? REBATE.spouse : 0;                            // D2: spouse relief 4,000 + D1 400 = 4,400
  return { ci, incomeTax, rebate: self + spouse, charged: Math.max(0, incomeTax - self - spouse) }; // D4
}

/* =====================================================================
   2. RELIEFS — mirror "kalkulator-cukai-tahun-taksiran-2025.xlsx".
   Caps follow the workbook's data-validation limits.
   Chargeable income (B25) = MAX(0, income − approved donations (A13) − total relief (B24)).
   PRS (B20) is preset to RM3,000; "without PRS" is the same calculation with B20 = 0.
   ===================================================================== */
const KIDS = [["u18", 2000], ["pre", 2000], ["deg", 8000], ["dis", 6000], ["disDeg", 14000]]; // Kalkulator Anak; 50% column = half
const HOUSE_CAP = { 500: 7000, 750: 5000 };                                                   // Faedah Pinjaman Perumahan
const GROUPS = [ // grouped by theme; items keep the workbook's B-order
  { id: "auto",      icon: "i-user",     items: [{ id: "indiv", type: "fixed", amount: 9000 },                          // B1
                                                 { id: "disabled", type: "check", amount: 7000 },                       // B4
                                                 { id: "eduFees", cap: 7000 }] },                                       // B5
  { id: "medical",   icon: "i-heart",    items: [{ id: "parents", cap: 8000 },                                          // B2
                                                 { id: "equip", cap: 6000 },                                            // B3
                                                 { id: "medSelf", cap: 10000 }] },                                      // B6–B9 (one input in workbook)
  { id: "lifestyle", icon: "i-sparkles", items: [{ id: "lifestyle", cap: 2500 },                                        // B10
                                                 { id: "sports", cap: 1000 },                                           // B11
                                                 { id: "breast", cap: 1000 }] },                                        // B12
  { id: "family",    icon: "i-users",    items: [{ id: "childcare", cap: 3000 },                                        // B13
                                                 { id: "sspn", cap: 8000 },                                             // B14
                                                 { id: "spouse", type: "check", amount: 4000 },                         // B15
                                                 { id: "spouseDis", type: "check", amount: 6000 },                      // B16
                                                 { id: "kids", type: "kids" }] },                                       // B17
  { id: "epf",       icon: "i-wallet",   items: [{ id: "life", cap: 3000 },                                             // B18 (life insurance)
                                                 { id: "epf", cap: 4000, auto: "epf" },                                 // B18 (EPF)
                                                 { id: "prs", cap: PRS_RELIEF, preset: PRS_RELIEF, prs: true },         // B20
                                                 { id: "eduMedIns", cap: 4000 },                                        // B21
                                                 { id: "socso", cap: 350, auto: "socso" }] },                           // B22
  { id: "home",      icon: "i-home",     items: [{ id: "house", type: "house" },                                        // B19
                                                 { id: "ev", cap: 2500 }] },                                            // B23
  { id: "donate",    icon: "i-gift",     items: [{ id: "donation", cap: Infinity, donation: true }] }                   // A13
];
const ITEMS = Object.fromEntries(GROUPS.flatMap((g) => g.items).map((it) => [it.id, it]));

function itemValue(it, s) {
  switch (it.type) {
    case "fixed": return it.amount;
    case "check": return s.ded[it.id] ? it.amount : 0;
    case "kids":  return KIDS.reduce((sum, [k, full]) => sum + full * s.kids[k][0] + full / 2 * s.kids[k][1], 0);
    case "house": return Math.min(HOUSE_CAP[s.house.band], s.house.amt);
    default:      return Math.min(it.cap, s.ded[it.id] ?? it.preset ?? 0);
  }
}
function chargeableIncome(s) {
  let reliefs = 0, donations = 0, prs = 0;
  const groupTotals = {};
  for (const g of GROUPS) {
    groupTotals[g.id] = 0;
    for (const it of g.items) {
      const v = itemValue(it, s);
      groupTotals[g.id] += v;
      if (it.donation) donations += v; else if (it.prs) prs += v; else reliefs += v;
    }
  }
  const beforePrs = s.income - donations - reliefs;
  return { donations, reliefs: reliefs + prs, prs, groupTotals, ci: Math.max(0, beforePrs - prs), ciWithoutPrs: Math.max(0, beforePrs) };
}
const AUTO_FILL = {
  epf: (income) => Math.min(4000, Math.round(income * 0.11)),                                       // 11% employee share
  socso: (income) => Math.min(350, Math.round(Math.min(income / 12, 6000) * 12 * 0.007))            // SOCSO + EIS ≈ 0.7%, wage ceiling RM6,000
};

/* Everything the page shows, from the current inputs. */
function calculate(s) {
  const relief = s.reliefsOn ? chargeableIncome(s) : null;
  const base = relief ? relief.ci : s.income;
  const idx = bandIndex(base);
  const rate = BANDS[idx][2];
  if (!relief) return { relief, base, idx, rate, prs: PRS_RELIEF, saving: PRS_RELIEF * rate };   // quick estimate: RM3,000 × top rate
  const without = taxCharged(relief.ciWithoutPrs, s.ded.spouse);
  const withPrs = taxCharged(relief.ci, s.ded.spouse);
  return { relief, base, idx, rate, prs: relief.prs, without, withPrs, saving: without.charged - withPrs.charged };
}

  return to === Infinity ? t("tb.above", { v: fmt(from) }) : `${i ? fmt(from + 1) : 0} – ${fmt(to)}`;
}
function setRange(el, v) {
  const min = +el.min, max = +el.max, c = Math.min(max, Math.max(min, v));
  el.value = c;
  el.style.setProperty("--pct", ((c - min) / (max - min)) * 100 + "%");
}

/* =====================================================================
   6. TEMPLATES — tax reliefs panel
   ===================================================================== */
const openGroups = new Set(["epf"]);

function fieldHTML(it) {
  if (it.type === "fixed") {
    return `<div class="field">
      <div class="f-head"><span class="f-label">${t("d." + it.id)}</span><span class="f-cap">${t("rl.automatic")}</span></div>
      <div class="input-locked"><span>${rm(it.amount)}</span>${icon("i-lock", 15)}</div>
      <p class="f-foot"></p></div>`;
  }
  const v = itemValue(it, state);
  const autoBtn = it.auto ? `<button type="button" class="f-auto" data-auto="${it.id}">${icon("i-calc", 12)}${t("rl.auto." + it.auto)}</button>` : "";
  const note = hint(it.id) ? `<span>${hint(it.id)}</span>` : "";
  return `<div class="field">
    <div class="f-head"><label class="f-label" for="d-${it.id}">${t("d." + it.id)}</label><span class="f-cap">${Number.isFinite(it.cap) ? t("rl.max", { v: fmt(it.cap) }) : t("rl.noCap")}</span></div>
    <div class="money-input sm"><span>RM</span><input class="input-glass" id="d-${it.id}" data-ded="${it.id}" inputmode="numeric" autocomplete="off" placeholder="0" value="${v ? fmt(v) : ""}" /></div>
    <p class="f-foot">${autoBtn}${note}</p></div>`;
}
const toggleHTML = (it) => `<label class="toggle-tile"><input type="checkbox" data-check="${it.id}" ${state.ded[it.id] ? "checked" : ""} />
  <span class="tt-check">${icon("i-check", 12)}</span><span class="tt-text">${t("d." + it.id)}</span><span class="tt-amt">${rm(it.amount)}</span></label>`;

function stepperHTML(k, col) {
  const v = state.kids[k][col], label = t(col ? "k.half" : "k.full");
  return `<div><span class="kid-cap">${label}</span>
    <div class="stepper${v ? " has-val" : ""}" data-kid="${k}" data-col="${col}" role="group" aria-label="${t("k." + k)}, ${label}">
      <button type="button" data-step="-1" aria-label="−" ${v ? "" : "disabled"}>−</button><output>${v}</output><button type="button" data-step="1" aria-label="+">+</button>
    </div></div>`;
}
function kidsHTML() {
  const rows = KIDS.map(([k, full]) => `<div class="kid-row"><div class="kid-label">${t("k." + k)}<small>${t("k.each", { v: fmt(full) })}</small></div>${stepperHTML(k, 0)}${stepperHTML(k, 1)}</div>`).join("");
  return `<div class="wide">
    <div class="f-head"><span class="f-label">${t("d.kids")}</span></div>
    <p class="f-foot">${t("h.kids")}</p>
    <div class="kids-list"><div class="kid-row kid-head"><span></span><span>${t("k.full")}</span><span>${t("k.half")}</span></div>${rows}</div>
  </div>`;
}
function houseHTML() {
  const amt = state.house.amt ? fmt(Math.min(HOUSE_CAP[state.house.band], state.house.amt)) : "";
  const options = Object.keys(HOUSE_CAP).map((b) => `<label><input type="radio" name="houseBand" data-house-band="${b}" ${state.house.band === b ? "checked" : ""} />
    <b>${t("hs." + b)}</b><small>${t("rl.max", { v: fmt(HOUSE_CAP[b]) })}</small></label>`).join("");
  return `<div class="wide">
    <div class="f-head"><span class="f-label">${t("d.house")}</span></div>
    <p class="f-foot">${t("h.house")}</p>
    <div class="seg2">${options}</div>
    <label class="sub-label" for="houseAmt">${t("hs.amt")}</label>
    <div class="money-input sm"><span>RM</span><input class="input-glass" id="houseAmt" data-house-amt inputmode="numeric" autocomplete="off" placeholder="0" value="${amt}" /></div>
  </div>`;
}
/* Keep item order; consecutive amount fields / tick tiles share one grid. */
function groupBodyHTML(g) {
  const parts = [];
  for (const it of g.items) {
    if (it.type === "kids") { parts.push(kidsHTML()); continue; }
    if (it.type === "house") { parts.push(houseHTML()); continue; }
    const kind = it.type === "check" ? "toggles" : "fields";
    const last = parts[parts.length - 1];
    const html = kind === "toggles" ? toggleHTML(it) : fieldHTML(it);
    if (last && last.kind === kind) last.html.push(html); else parts.push({ kind, html: [html] });
  }
  return parts.map((p) => typeof p === "string" ? p : `<div class="${p.kind}">${p.html.join("")}</div>`).join("");
}
function buildReliefPanel() {
  $("reliefToggle").checked = state.reliefsOn;
  $("reliefPanel").hidden = !state.reliefsOn;
  $("reliefPanel").innerHTML = `
    <div class="flow" aria-live="polite">
      <div class="flow-grid">
        <div class="flow-item"><span>${t("rl.income")}</span><b id="flowIncome"></b></div>
        <div class="flow-op" aria-hidden="true">−</div>
        <div class="flow-item minus"><span>${t("rl.deduct")}</span><b id="flowDeduct"></b></div>
        <div class="flow-op" aria-hidden="true">=</div>
        <div class="flow-item result"><span>${t("rl.ci")}</span><b id="flowCi"></b></div>
      </div>
      <div class="flow-bar" aria-hidden="true"><i class="fb-ci" id="fbCi"></i><i class="fb-rel" id="fbRel"></i></div>
      <p class="flow-note">${t("rl.note")}</p>
    </div>
    ${GROUPS.map((g) => `<details class="cat" data-group="${g.id}" ${openGroups.has(g.id) ? "open" : ""}>
      <summary>
        <span class="cat-icon">${icon(g.icon, 18)}</span>
        <span class="cat-text"><span class="cat-title">${t("g." + g.id)}</span><span class="cat-meta" data-meta="${g.id}"></span></span>
        <span class="cat-total" data-total="${g.id}"></span>
        <span class="cat-chev">${icon("i-chevron")}</span>
      </summary>
      <div class="cat-body">${groupBodyHTML(g)}</div></details>`).join("")}
    <div class="rl-foot"><button type="button" class="rl-reset" id="reliefReset">${icon("i-reset", 14)}${t("rl.reset")}</button></div>`;
}

/* =====================================================================
   7. RENDER
   ===================================================================== */
function applyStaticText() {
  document.documentElement.lang = state.lang === "bm" ? "ms-MY" : "en-MY";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n, { y: YEAR }); });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  document.querySelectorAll("[data-nav]").forEach((a) => { a.href = "https://prscalculator.ppa.my" + NAV_PATHS[state.lang][a.dataset.nav]; });
  buildReliefPanel();
}

function renderInputs() {
  const input = $("incomeInput");
  if (document.activeElement !== input) input.value = fmt(state.income);
  setRange($("incomeRange"), state.income);
  $("incomeChips").innerHTML = PRESETS.map((v) =>
    `<button type="button" class="chip${state.income === v ? " is-active" : ""}" data-chip="${v}">RM${v / 1000}k</button>`).join("");
}

function renderReliefSummary({ relief }) {
  if (!relief) return;
  const deducted = Math.min(relief.donations + relief.reliefs, state.income);
  const ciPct = state.income > 0 ? (relief.ci / state.income) * 100 : 0;
  $("flowIncome").textContent = rm(state.income);
  $("flowDeduct").textContent = rm(deducted);
  $("flowCi").textContent = rm(relief.ci);
  $("fbCi").style.width = ciPct + "%";
  $("fbRel").style.width = (state.income > 0 ? 100 - ciPct : 0) + "%";
  for (const g of GROUPS) {
    const total = relief.groupTotals[g.id];
    const pill = document.querySelector(`[data-total="${g.id}"]`);
    pill.textContent = rm(total);
    pill.classList.toggle("is-zero", total <= 0);
    const n = g.items.filter((it) => it.type !== "fixed" && itemValue(it, state) > 0).length;
    document.querySelector(`[data-meta="${g.id}"]`).textContent = n ? t("g.meta", { n }) : t(g.id === "auto" ? "g.metaAuto" : "g.metaNone");
  }
}

let shownSaving = 0, animFrame = 0;
function animateSaving(to) {
  cancelAnimationFrame(animFrame);
  const from = shownSaving, start = performance.now();
  const instant = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = (now) => {
    const p = instant ? 1 : Math.min(1, (now - start) / 450);
    $("bigSaving").textContent = rm(from + (to - from) * (1 - (1 - p) ** 3));
    if (p < 1) animFrame = requestAnimationFrame(step); else shownSaving = to;
  };
  animFrame = requestAnimationFrame(step);
}

function renderSaving({ relief, base, idx, rate, prs, saving, without }) {
  const cost = prs - saving;
  const savePct = prs > 0 ? (saving / prs) * 100 : 0;
  animateSaving(saving);
  $("costLine").innerHTML = !prs ? t("r.noPrs") : t(saving > 0 ? "r.costLine" : "r.costZero", { p: fmt(prs), n: fmt(cost) });
  $("splitSave").style.width = savePct + "%";
  $("splitCost").style.width = (prs > 0 ? 100 - savePct : 0) + "%";
  $("splitBar").setAttribute("aria-label", `${t("r.taxSaved")} ${rm(saving)}, ${t("r.cost")} ${rm(cost)}`);
  $("legSave").textContent = rm(saving);
  $("legCost").textContent = rm(cost);
  const noTax = relief ? without.charged <= 0 : rate === 0;
  $("zeroNote").innerHTML = noTax ? `<div class="note">${icon("i-info", 18)}<div>${t(relief ? "r.zeroRelief" : "r.zero")}</div></div>` : "";
  $("rateValue").textContent = pct(rate);
  $("rateSub").textContent = relief ? t("r.rateSubRelief", { ci: fmt(base) }) : t("r.rateSub", { band: bandLabel(idx) });
}

function renderTaxView({ relief, withPrs }) {
  const view = $("viewTax");
  if (!relief) {
    view.innerHTML = `<div class="tv-teaser">
      <span class="icon-tile">${icon("i-calc", 22)}</span>
      <div class="tv-teaser-title">${t("tv.teaserTitle")}</div>
      <div class="tv-teaser-sub">${t("tv.teaserSub")}</div>
      <button type="button" class="btn-secondary btn-sm" id="tvEnable">${t("rl.title")}</button></div>`;
    return;
  }
  const s = withPrs;   // tax on the reliefs entered, PRS included
  const label = s.charged > 0 ? t("tv.charged") : t("tv.zero");
  const tiers = taxTiers(s.ci);
  const bar = tiers.map((x) => `<i style="width:${(x.portion / s.ci) * 100}%;background:${tierColor(x.i)}"></i>`).join("");
  const rows = tiers.map((x, k) => `<li><span class="sw" style="background:${tierColor(x.i)}"></span>
    <span>${t(k ? "tv.next" : "tv.first", { v: fmt(x.portion) })}</span><span class="rt">${pct(x.rate)}</span><span class="tx">${rm2(x.tax)}</span></li>`).join("");
  const lines = s.rebate
    ? `<div class="line strong"><span>${t("tv.incomeTax")}</span><b>${rm2(s.incomeTax)}</b></div>
       <div class="line"><span>${t("tv.rebate")}</span><b>− ${rm2(s.rebate)}</b></div>
       <div class="line total"><span>${label}</span><b>${rm2(s.charged)}</b></div>`
    : `<div class="line total solo"><span>${label}</span><b>${rm2(s.charged)}</b></div>`;

  view.innerHTML = `
    <div class="eyebrow">${t("tv.eyebrow")}</div>
    <div class="tv-label">${label}</div>
    <div class="tv-amt${s.charged > 0 ? "" : " zero"}">${rm(s.charged)}</div>
    ${tiers.length ? `<div class="tv-sec">
      <div class="tv-h"><span>${t("tv.calc")}</span><b>${t("rl.ci")} ${rm(s.ci)}</b></div>
      <div class="tier-bar" aria-hidden="true">${bar}</div>
      <ul class="tier-list">${rows}</ul>
    </div>` : ""}
    <div class="tv-sec lines">${lines}</div>
    <p class="tv-foot">${t("tv.foot")}</p>`;
}

function renderTabs() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  $("viewSave").hidden = state.tab !== "save";
  $("viewTax").hidden = state.tab !== "tax";
}

function renderTable({ relief, idx }) {
  $("tbBandHead").textContent = `${t(relief ? "rl.ci" : "in.income")} (RM)`;
  $("bracketsBody").innerHTML = BANDS.map(([, , r], i) => {
    const saved = PRS_RELIEF * r, current = i === idx;
    return `<tr class="${current ? "is-current" : ""}" data-band="${i}">
      <td>${bandLabel(i)}${current ? `<span class="you">${t("tb.you")}</span>` : ""}</td>
      <td class="num">${pct(r)}</td><td class="num save">${rm(saved)}</td><td class="num cost-col">${rm(PRS_RELIEF - saved)}</td></tr>`;
  }).join("");
}

let result;
function render() {
  result = calculate(state);
  renderInputs();
  renderReliefSummary(result);
  renderSaving(result);
  renderTabs();
  renderTaxView(result);
  renderTable(result);
}
function update() { save(); render(); }

/* =====================================================================
   8. EVENTS
   ===================================================================== */
const incomeInput = $("incomeInput");
incomeInput.addEventListener("input", () => { state.income = Math.min(1e9, parseNum(incomeInput.value)); update(); });
incomeInput.addEventListener("focus", () => incomeInput.select());
incomeInput.addEventListener("blur", render);
$("incomeRange").addEventListener("input", (e) => { state.income = +e.target.value; update(); });
$("incomeChips").addEventListener("click", (e) => {
  const chip = e.target.closest("[data-chip]");
  if (chip) { state.income = +chip.dataset.chip; update(); }
});
$("bracketsBody").addEventListener("click", (e) => {     // rows map to income only when reliefs are off
  const row = e.target.closest("[data-band]");
  if (!row || state.reliefsOn) return;
  const [from, to] = BANDS[+row.dataset.band];
  state.income = to === Infinity ? from + 500000 : Math.round((from + to) / 2000) * 1000;
  update();
  $("resultCard").scrollIntoView({ behavior: "smooth", block: "center" });
});
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; save(); applyStaticText(); render();
}));

// Tax reliefs panel
$("reliefToggle").addEventListener("change", (e) => { state.reliefsOn = e.target.checked; $("reliefPanel").hidden = !state.reliefsOn; update(); });
const panel = $("reliefPanel");
panel.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.ded) state.ded[el.dataset.ded] = Math.min(ITEMS[el.dataset.ded].cap, parseNum(el.value));   // workbook rejects amounts above the limit
  else if (el.id === "houseAmt") state.house.amt = Math.min(HOUSE_CAP[state.house.band], parseNum(el.value));
  else return;
  update();
});
panel.addEventListener("focusout", (e) => {             // show the capped, formatted value
  const el = e.target;
  if (el.dataset.ded) { const v = itemValue(ITEMS[el.dataset.ded], state); el.value = v ? fmt(v) : ""; }
  else if (el.id === "houseAmt") el.value = state.house.amt ? fmt(state.house.amt) : "";
});
panel.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.check) state.ded[el.dataset.check] = el.checked;
  else if (el.dataset.houseBand) {
    state.house.band = el.dataset.houseBand;
    state.house.amt = Math.min(HOUSE_CAP[state.house.band], state.house.amt);
    $("houseAmt").value = state.house.amt ? fmt(state.house.amt) : "";
  } else return;
  update();
});
panel.addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step) {
    const box = step.closest(".stepper"), col = +box.dataset.col, counts = state.kids[box.dataset.kid];
    counts[col] = Math.max(0, Math.min(20, counts[col] + +step.dataset.step));
    box.querySelector("output").textContent = counts[col];
    box.querySelector('[data-step="-1"]').disabled = counts[col] === 0;
    box.classList.toggle("has-val", counts[col] > 0);
    update();
    return;
  }
  const auto = e.target.closest("[data-auto]");
  if (auto) {
    const id = auto.dataset.auto;
    state.ded[id] = AUTO_FILL[ITEMS[id].auto](state.income);
    $("d-" + id).value = fmt(state.ded[id]);
    update();
    return;
  }
  if (e.target.closest("#reliefReset")) {
    Object.assign(state, { ded: {}, kids: freshKids(), house: { band: "500", amt: 0 } });
    buildReliefPanel();
    update();
  }
});
panel.addEventListener("toggle", (e) => {                 // remember which categories are open
  const g = e.target.dataset?.group;
  if (g) e.target.open ? openGroups.add(g) : openGroups.delete(g);
}, true);

// Result tabs + "My tax" view
document.querySelector(".tabs").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; update(); }
});
$("viewTax").addEventListener("click", (e) => {
  if (e.target.closest("#tvEnable")) {
    state.reliefsOn = true;
    buildReliefPanel();
    update();
    document.querySelector(".reliefs").scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

// Header
const header = $("header");
const onScroll = () => header.classList.toggle("is-compact", window.scrollY > 12);
window.addEventListener("scroll", onScroll, { passive: true });
$("menuBtn").addEventListener("click", () => {
  const open = !$("mobileMenu").classList.contains("is-open");
  $("mobileMenu").classList.toggle("is-open", open);
  header.classList.toggle("menu-open", open);
  $("menuBtn").setAttribute("aria-expanded", String(open));
  $("menuBtn").innerHTML = icon(open ? "i-x" : "i-menu", 22);
});

// Analytics (fires only when gtag is on the page)
document.querySelectorAll("[data-track]").forEach((a) => a.addEventListener("click", () => {
  if (typeof window.gtag === "function") window.gtag("event", "tax_calc_" + a.dataset.track, { saving: Math.round(result.saving), reliefs: state.reliefsOn });
}));

/* INIT */
applyStaticText();
render();
onScroll();
</script>
</body>
</html>
